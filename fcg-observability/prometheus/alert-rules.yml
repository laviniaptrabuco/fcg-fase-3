groups:
  - name: fcg_alerts
    interval: 30s
    rules:
      # http_requests_total e http_request_duration_seconds_bucket vem do
      # UseHttpMetrics() do prometheus-net, exposto em /metrics pelo
      # users-api e catalog-api (job "microservices" no scrape config).
      - alert: HighErrorRate
        expr: rate(http_requests_total{code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro alta detectada"
          description: "{{ $value | humanizePercentage }} dos requests retornaram erro 5xx"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latência alta detectada"
          description: "P95 latência: {{ $value }}s"

      - alert: ServiceDown
        expr: up{job=~"microservices|kong"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Serviço {{ $labels.instance }} não está respondendo"
