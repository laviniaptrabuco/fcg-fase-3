services:
  # API Gateway
  kong-database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5432:5432"
    volumes:
      - ./fcg-observability/postgres/init-konga-db.sh:/docker-entrypoint-initdb.d/init-konga-db.sh:ro
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  kong-migration:
    image: kong:latest
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - fcg-network

  kong:
    image: kong:latest
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Sem isto o Admin API escuta em 127.0.0.1 (loopback do container)
      # e a porta publicada 8001 nunca responde.
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      # O Kong nao interpreta bem o resolv.conf gerado pelo Docker
      # (options ndots:0) e falha com "name resolution failed".
      # Apontar o DNS embutido do Docker explicitamente resolve.
      KONG_DNS_RESOLVER: "127.0.0.11:53"
      KONG_DNS_ORDER: "A,CNAME,LAST,SRV"
    depends_on:
      kong-migration:
        condition: service_completed_successfully
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  konga:
    image: pantsel/konga:latest
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga
    depends_on:
      - kong
    networks:
      - fcg-network

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./fcg-observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./fcg-observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fcg-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - ./fcg-observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      # O provider (yaml) e os dashboards (json) vao em pastas separadas:
      # o Grafana so aceita arquivos de provider em provisioning/dashboards.
      - ./fcg-observability/grafana/dashboards-provider:/etc/grafana/provisioning/dashboards:ro
      - ./fcg-observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fcg-network

  # Data Layer
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: fcg_db
    volumes:
      - mongodb-data:/data/db
      - ./fcg-observability/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - fcg-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - fcg-network

  # Message Queue (para Serverless trigger)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fcg-network

  # SQL Server - dados centrais herdados da Fase 2 (usuarios, catalogo de
  # jogos). MongoDB guarda dados expandidos (perfis, reviews) e Redis faz
  # cache: as tres juntas sao a persistencia poliglota da Fase 3.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FCG_Dev@2024"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Login real, nao so a porta TCP: o SQL Server aceita conexao TCP
      # bem antes de estar pronto para autenticar, e login falho ativa o
      # PoolBlockingPeriod do SqlClient no app (bloqueia novas tentativas
      # por um tempo mesmo depois do banco ficar disponivel).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - fcg-network

  # Microsservicos - appsettings.Development.json sobrescreve
  # DefaultConnection/RabbitMQ:Host para "localhost"; as env vars abaixo
  # tem prioridade sobre qualquer appsettings*.json e corrigem para os
  # nomes de servico do compose.
  users-api:
    restart: on-failure:10
    image: fcg-users-api:fase3
    build: ./fcg-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FCG_Users;User Id=SA;Password=FCG_Dev@2024;TrustServerCertificate=True;"
      ConnectionStrings__MongoDB: "mongodb://admin:admin@mongodb:27017"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - fcg-network

  catalog-api:
    restart: on-failure:10
    image: fcg-catalog-api:fase3
    build: ./fcg-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FCG_Catalog;User Id=SA;Password=FCG_Dev@2024;TrustServerCertificate=True;"
      ConnectionStrings__MongoDB: "mongodb://admin:admin@mongodb:27017"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - fcg-network

  payments-api:
    restart: on-failure:10
    image: fcg-payments-api:fase3
    build: ./fcg-payments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MongoDB: "mongodb://admin:admin@mongodb:27017"
      RabbitMQ__Host: rabbitmq
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - fcg-network

volumes:
  kong-db-data:
  sqlserver-data:
  prometheus-data:
  grafana-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:

networks:
  fcg-network:
    driver: bridge
