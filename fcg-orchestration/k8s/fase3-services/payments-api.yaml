# payments-api e um Worker Service (consome RabbitMQ), sem servidor HTTP.
# Por isso nao tem readinessProbe HTTP nem Service - nao recebe trafego direto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg-fase3
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      containers:
        - name: payments-api
          image: fcg-payments-api:fase3
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__MongoDB
              value: "mongodb://admin:admin@mongodb:27017"
            - name: RabbitMQ__Host
              value: rabbitmq
