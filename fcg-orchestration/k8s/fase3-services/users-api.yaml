apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg-fase3
spec:
  replicas: 1
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
    spec:
      # K8s nao tem "depends_on" com healthcheck como o compose; um
      # initContainer que so termina quando o SQL Server aceita conexao
      # evita a corrida que derrubava o EnsureCreated() no boot da app.
      initContainers:
        - name: wait-for-sqlserver
          # Testa LOGIN real, nao so a porta TCP: o SQL Server aceita
          # conexoes TCP bem antes de estar pronto para autenticar, e
          # tentativas de login falhas do app disparam o PoolBlockingPeriod
          # do SqlClient (bloqueia novas tentativas por um tempo mesmo
          # depois do banco ficar disponivel).
          image: mcr.microsoft.com/mssql-tools
          command:
            - /bin/sh
            - -c
            - >
              until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -P "FCG_Dev@2024" -Q "SELECT 1";
              do echo aguardando login no sqlserver...; sleep 3; done
      containers:
        - name: users-api
          image: fcg-users-api:fase3
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            # appsettings.Development.json sobrescreve DefaultConnection
            # para "localhost,1433" e RabbitMQ:Host para "localhost" -
            # variaveis de ambiente tem prioridade sobre qualquer
            # appsettings*.json e corrigem isso para os nomes de Service.
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver;Database=FCG_Users;User Id=SA;Password=FCG_Dev@2024;TrustServerCertificate=True;"
            - name: ConnectionStrings__MongoDB
              value: "mongodb://admin:admin@mongodb:27017"
            - name: ConnectionStrings__Redis
              value: "redis:6379"
            - name: RabbitMQ__Host
              value: rabbitmq
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: fcg-fase3
spec:
  selector: { app: users-api }
  ports:
    - port: 8080
      targetPort: 8080
