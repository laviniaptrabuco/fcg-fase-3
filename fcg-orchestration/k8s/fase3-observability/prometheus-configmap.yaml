apiVersion: v1
data:
  alert-rules.yml: |
    groups:
      - name: fcg_alerts
        interval: 30s
        rules:
          # http_requests_total e http_request_duration_seconds_bucket vem do
          # UseHttpMetrics() do prometheus-net, exposto em /metrics pelo
          # users-api e catalog-api (job "microservices" no scrape config).
          - alert: HighErrorRate
            expr: rate(http_requests_total{code=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Taxa de erro alta detectada"
              description: "{{ $value | humanizePercentage }} dos requests retornaram erro 5xx"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latência alta detectada"
              description: "P95 latência: {{ $value }}s"

          - alert: ServiceDown
            expr: up{job=~"microservices|kong"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Serviço {{ $labels.instance }} não está respondendo"
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'fcg-monitor'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - 'alert-rules.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kong'
        static_configs:
          - targets: ['kong:8001']
        metrics_path: '/metrics'

      # UsersAPI e CatalogAPI expoem /metrics via prometheus-net (UseHttpMetrics()).
      # Este e o job exigido pelo TC: latencia, contagem de requisicoes e taxa de
      # erro dos microsservicos (nao apenas do gateway).
      - job_name: 'microservices'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['users-api:8080']
            labels: { service: 'users-api' }
          - targets: ['catalog-api:8080']
            labels: { service: 'catalog-api' }

    # Nota: mongodb e redis nao expoem /metrics nativamente - exigiriam
    # mongodb_exporter / redis_exporter dedicados, fora do escopo obrigatorio
    # do TC (que pede metricas de UsersAPI e CatalogAPI).
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fcg-fase3
