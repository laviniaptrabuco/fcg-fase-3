apiVersion: v1
data:
  api-gateway.json: |
    {
      "id": null,
      "uid": "fcg-microservices-dashboard",
      "title": "FCG - UsersAPI & CatalogAPI",
      "tags": ["FCG", "microservices", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Requisições totais (rate por segundo)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (service)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Requisições por status code HTTP",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (code)",
              "legendFormat": "HTTP {{code}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latência P95 (segundos)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "{{service}} p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "title": "Taxa de erro (5xx / total) %",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))",
              "legendFormat": "error rate %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Total de requisições (contador acumulado)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 16 },
          "targets": [
            { "expr": "sum(http_requests_total)", "legendFormat": "total" }
          ]
        },
        {
          "id": 6,
          "title": "Kong - Requisições por segundo (gateway)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 16 },
          "targets": [
            { "expr": "rate(kong_http_requests_total[5m])", "legendFormat": "kong" }
          ]
        },
        {
          "id": 7,
          "title": "Serviços UP (1 = up, 0 = down)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 16 },
          "targets": [
            { "expr": "up{job=\"microservices\"}", "legendFormat": "{{service}}" }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: fcg-fase3
