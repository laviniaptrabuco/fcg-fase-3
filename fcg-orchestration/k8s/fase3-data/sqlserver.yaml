# SQL Server - base relacional herdada da Fase 2 (EF Core).
# Users e Games "core" continuam aqui; MongoDB guarda os dados expandidos
# (reviews, perfis) e Redis faz cache. Isso e persistencia poliglota real:
# SQL Server (relacional) + MongoDB (documento) + Redis (cache).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: fcg-fase3
spec:
  replicas: 1
  selector:
    matchLabels: { app: sqlserver }
  template:
    metadata:
      labels: { app: sqlserver }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{ containerPort: 1433 }]
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              value: "FCG_Dev@2024"
            - name: MSSQL_PID
              value: Developer
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
      volumes:
        - name: sqlserver-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: fcg-fase3
spec:
  selector: { app: sqlserver }
  ports:
    - port: 1433
      targetPort: 1433
