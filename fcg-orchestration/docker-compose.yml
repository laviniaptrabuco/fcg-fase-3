version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-sqlserver
    environment:
      SA_PASSWORD: "FCG_Dev@2024"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "FCG_Dev@2024" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  users-api:
    build:
      context: ../fcg-users-api
      dockerfile: Dockerfile
    container_name: fcg-users-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FCG_Users;User Id=SA;Password=FCG_Dev@2024;TrustServerCertificate=True;
      - Jwt__Secret=FCG_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_32CHARS!
      - Jwt__Issuer=FiapCloudGames
      - Jwt__Audience=FiapCloudGamesUsers
      - Jwt__ExpirationHours=8
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-api:
    build:
      context: ../fcg-catalog-api
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FCG_Catalog;User Id=SA;Password=FCG_Dev@2024;TrustServerCertificate=True;
      - Jwt__Secret=FCG_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_32CHARS!
      - Jwt__Issuer=FiapCloudGames
      - Jwt__Audience=FiapCloudGamesUsers
      - Jwt__ExpirationHours=8
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments-api:
    build:
      context: ../fcg-payments-api
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifications-api:
    build:
      context: ../fcg-notifications-api
      dockerfile: Dockerfile
    container_name: fcg-notifications-api
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
  sqlserver_data:
